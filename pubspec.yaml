name: ethora_sdk_flutter
description: Ethora chat SDK for Flutter. Web config parity with Swift/Kotlin initialization behavior.
version: 0.1.0
homepage: https://github.com/dappros/ethora
repository: https://github.com/dappros/ethora
issue_tracker: https://github.com/dappros/ethora/issues

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  web_socket_channel: ^3.0.3
  xml: ^6.5.0
  shared_preferences: ^2.5.3
  file_picker: ^10.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
